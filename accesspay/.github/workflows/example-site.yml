name: Deploy example shop to GitHub Pages

# Publishes examples/bookshop (a plain website that uses AccessPay payment links)
# at https://<your-username>.github.io/accesspay/
on:
  push:
    branches: [main]
    paths: ['examples/bookshop/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/bookshop
      - id: deployment
        uses: actions/deploy-pages@v4
