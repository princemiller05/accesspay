# Render Blueprint: one free web service runs the gateway API, demo shop,
# merchant dashboard and the built frontend.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: accesspay
    runtime: node
    plan: free
    region: singapore   # closest Render region to India; create the Neon database in Singapore too
    # --include=dev: with NODE_ENV=production npm skips devDependencies, but the build needs Vite.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL   # paste your Neon connection string when Render asks
        sync: false